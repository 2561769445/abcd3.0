id: exposed-zookeeper

info:
  name: Apache ZooKeeper - Unauthenticated Access
  author: xc
  severity: high
  description: Apache ZooKeeper was able to be accessed without any required authentication.
  metadata:
    max-request: 1
  tags: network,zookeeper,unauth,exposure

tcp:
  - inputs:
      - data: "envi\r\nquit\r\n"

    host:
      - "{{Hostname}}"
    port: 2181
    read-size: 2048

    matchers:
      - type: word
        words:
          - "zookeeper.version"
# digest: 4a0a00473045022014b3e49e3178002b8dcd33b9d693d9f46eeb889f0eaa6a018af2df218c4ff7ba022100f98b32691d42de5653570b72cf83b1895de00ca6c195b9a3e3b05885b12624bf:922c64590222798bb761d5b6d8e72950id: jolokia-list

info:
  name: Jolokia - List
  author: xc
  severity: low
  metadata:
    max-request: 2
  tags: jolokia,springboot,tomcat,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/jolokia/list"
      - "{{BaseURL}}/actuator/jolokia/list"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - '"type":"list"'

# digest: 4b0a00483046022100c73bc6e5ae594d2f7153bac1113cff55f9557d36148b75a999bbf25bf5b64933022100a61a6f879e5d8cbef34e2fd8d18757f37360e1676acf959d89f09fcbac70d4aa:922c64590222798bb761d5b6d8e72950
id: poc-yaml-bessystem-bes-spark-rce
info:
  tags: poc-yaml-bessystem-bes-spark-rce
  name: 宝兰德BES中间件 spark 远程代码执行漏洞
  severity: Critical
  finger: 宝兰德BES中间件
  fofa: body="BES Application Server"
  
requests:
  - method: GET
    path:
      - "{{BaseURL}}/BesEJB/spark"
    expression: |
      status_code == 500 &&
      contains(body,"Spark expects a POST containing an RPC call") &&
      !contains(body,"<")
  - method: POST
    path:
      - "{{BaseURL}}/BesEJB/spark"
    expression: |
      status_code == 500 &&
      contains(body,"com.bes.ejb.spark.EjbSparkUtil.readRequestPackage") &&
      contains(body,"<")
